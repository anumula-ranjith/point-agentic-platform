<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Point — Fund Intelligence Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f9fafb; --ink:#101828; --ink-2:#344054;
  --muted:#667085; --muted-2:#98a2b3; --line:#e4e7ec; --line-2:#d0d5dd;
  --accent:#3157d5; --accent-weak:#eef2fe; --pos:#16855b; --pos-weak:#e8f5ef;
  --warn:#d97706; --warn-weak:#fdf3e7; --crit:#c9362b; --crit-weak:#fcecea;
  --sans:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:6px; --r-lg:8px;
  --sh:0 1px 2px rgba(16,24,40,.05); --sh-lg:0 8px 24px -8px rgba(16,24,40,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pos{color:var(--pos)}.neg{color:var(--crit)}.warnc{color:var(--warn)}.mut{color:var(--muted)}
.mono{font-family:var(--mono)}
::selection{background:var(--accent);color:#fff}

/* shell */
.app{display:flex;min-height:100vh}
.side{width:216px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;padding:15px 16px;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:7px;background:var(--ink);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.2px}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.3px}
.nav{padding:8px;flex:1}
.nav-lab{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted-2);font-weight:600;padding:12px 8px 5px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:var(--r);color:var(--ink-2);
  font-weight:500;font-size:13px;cursor:pointer;transition:.1s;margin-bottom:1px}
.nav a:hover{background:var(--panel-2)}
.nav a.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav a .ic{width:17px;height:17px;flex:none;opacity:.8}
.nav a.on .ic{opacity:1}
.nav a .cnt{margin-left:auto;background:var(--crit);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.side-foot{border-top:1px solid var(--line);padding:11px 12px}
.role-pick{display:flex;align-items:center;gap:9px;cursor:pointer;border-radius:var(--r);padding:5px;transition:.1s}
.role-pick:hover{background:var(--panel-2)}
.rp-av{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.rp-name{font-weight:600;font-size:12.5px}.rp-role{font-size:11px;color:var(--muted)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* topbar */
.top{display:flex;align-items:center;gap:14px;padding:0 20px;height:54px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.fundsel{position:relative}
.fundsel-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:var(--r);
  padding:6px 11px;background:var(--panel);cursor:pointer;font-family:var(--sans)}
.fundsel-btn:hover{border-color:var(--muted-2)}
.fs-ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
.fs-main{text-align:left}
.fs-name{font-weight:600;font-size:13px;line-height:1.2}
.fs-sub{font-size:10.5px;color:var(--muted)}
.fs-caret{color:var(--muted-2);margin-left:4px}
.fundsel-menu{position:absolute;top:calc(100% + 6px);left:0;width:320px;background:var(--panel);
  border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:6px;z-index:40;
  opacity:0;transform:translateY(-5px);pointer-events:none;transition:.15s}
.fundsel.open .fundsel-menu{opacity:1;transform:none;pointer-events:auto}
.fundsel.open .fs-caret{transform:rotate(180deg)}
.fund-opt{display:flex;align-items:center;gap:10px;padding:9px;border-radius:var(--r);cursor:pointer}
.fund-opt:hover{background:var(--panel-2)}
.fund-opt.on{background:var(--accent-weak)}
.fund-opt .fo-aum{margin-left:auto;text-align:right;font-size:12px;font-weight:600}
.fund-opt.on .fo-aum{color:var(--accent)}
.asof{font-size:11.5px;color:var(--muted);line-height:1.35}
.asof b{color:var(--ink-2);font-weight:600}
.top-sp{flex:1}
.ask-mini{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r);
  padding:7px 11px;min-width:240px;color:var(--muted);cursor:text}
.ask-mini input{border:none;outline:none;font-family:var(--sans);font-size:12.5px;flex:1;background:none;color:var(--ink)}
.freshdot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.fd{width:7px;height:7px;border-radius:50%;background:var(--pos)}
.fd.live{background:var(--pos);box-shadow:0 0 0 3px var(--pos-weak);animation:pl 2s infinite}
.fd.delay{background:var(--warn)}.fd.stale{background:var(--muted-2)}
@keyframes pl{50%{opacity:.5}}
.icon-btn{width:34px;height:34px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel);
  display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative}
.icon-btn:hover{color:var(--ink);border-color:var(--muted-2)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--crit)}

/* views */
.view{display:none;padding:18px 20px 40px;max-width:1680px;width:100%;margin:0 auto}
.view.on{display:block}
.pg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.pg-title{font-size:19px;font-weight:700;letter-spacing:-.3px}
.pg-sub{font-size:12.5px;color:var(--muted);margin-top:2px}

/* kpi strip */
.kstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px}
.kcell{background:var(--panel);padding:11px 14px}
.klab{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
.kval{font-size:18px;font-weight:700;margin-top:3px;letter-spacing:-.3px}
.ksub{font-size:11px;margin-top:1px}

.grid{display:grid;gap:14px}
.g-3{grid-template-columns:1.1fr 1fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
.g-2b{grid-template-columns:1.4fr 1fr}
@media(max-width:1200px){.g-3,.g-2,.g-2b{grid-template-columns:1fr}.kstrip{grid-template-columns:repeat(4,1fr)}}

/* card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:13.5px;font-weight:600;margin:0}
.card-h .sp{flex:1}
.card-b{padding:14px 15px}
.card-b.flush{padding:0}
.pill{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.crit{background:var(--crit-weak);color:var(--crit)}
.pill.warn{background:var(--warn-weak);color:var(--warn)}
.pill.ok{background:var(--pos-weak);color:var(--pos)}
.pill.info{background:var(--accent-weak);color:var(--accent)}
.pill.neu{background:#f2f4f7;color:var(--muted)}
.tag{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

/* health score */
.health{display:flex;gap:18px;align-items:center;padding:4px 0 10px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rn{font-size:30px;font-weight:700;letter-spacing:-1px}
.ring .rl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.health-meta{font-size:12px;color:var(--muted)}
.health-meta b{color:var(--ink)}
.hcomp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.hc{background:var(--panel);padding:10px 14px;cursor:pointer;transition:.1s}
.hc:hover{background:var(--panel-2)}
.hc-top{display:flex;align-items:baseline;gap:7px}
.hc-name{font-size:12px;font-weight:600}
.hc-val{margin-left:auto;font-size:15px;font-weight:700}
.hc-chg{font-size:11px;font-weight:600}
.hc-bar{height:4px;border-radius:3px;background:var(--line);margin:6px 0 5px;overflow:hidden}
.hc-fill{height:100%;border-radius:3px}
.hc-why{font-size:10.5px;color:var(--muted);line-height:1.4}

/* what changed */
.wc-cat{border-bottom:1px solid var(--line);padding:11px 15px}
.wc-cat:last-child{border:none}
.wc-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:8px}
.wc-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;cursor:pointer;border-radius:4px}
.wc-row:hover{background:var(--panel-2)}
.wc-row .lab{color:var(--ink-2)}
.wc-row .chg{margin-left:auto;font-weight:600;font-family:var(--mono);font-size:12px}
.wc-arrow{color:var(--muted-2);margin:0 2px}

/* action cards */
.acard{border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:10px;overflow:hidden;cursor:pointer;transition:.12s;background:var(--panel)}
.acard:hover{border-color:var(--line-2);box-shadow:var(--sh-lg)}
.acard.crit{border-left:3px solid var(--crit)}
.acard.warn{border-left:3px solid var(--warn)}
.acard.opp{border-left:3px solid var(--accent)}
.ac-h{display:flex;align-items:center;gap:9px;padding:11px 14px 0}
.ac-ttl{font-size:13.5px;font-weight:600;padding:7px 14px 3px;line-height:1.35}
.ac-m{display:flex;gap:20px;padding:4px 14px 10px;flex-wrap:wrap}
.ac-mi .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.ac-mi .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.ac-foot{display:flex;align-items:center;gap:7px;padding:9px 14px;border-top:1px solid var(--line);background:var(--panel-2)}
.btn{font-family:var(--sans);font-weight:600;font-size:12px;border-radius:var(--r);padding:6px 12px;border:1px solid transparent;cursor:pointer;transition:.1s}
.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{background:#274bc0}
.btn.gh{background:var(--panel);border-color:var(--line-2);color:var(--ink-2)}.btn.gh:hover{border-color:var(--muted-2)}
.btn.sm{padding:4px 9px;font-size:11px}
.ac-foot .meta{margin-left:auto;font-size:10.5px;color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t thead th{position:sticky;top:0;background:var(--panel-2);text-align:right;font-weight:600;color:var(--muted);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;cursor:pointer;z-index:1}
table.t thead th.l{text-align:left}
table.t tbody td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tbody td.l{text-align:left}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:var(--accent-weak)}
.tk{font-weight:600}
.co{color:var(--muted);font-size:11px}
.side-l{color:var(--pos);font-weight:600;font-size:11px}
.side-s{color:var(--crit);font-weight:600;font-size:11px}
.minibar{display:inline-block;width:44px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;overflow:hidden;position:relative}
.minibar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}

/* filters */
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.fchip{font-size:11.5px;font-weight:500;padding:5px 11px;border-radius:20px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;color:var(--ink-2)}
.fchip:hover{border-color:var(--muted-2)}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.srch{border:1px solid var(--line-2);border-radius:var(--r);padding:6px 10px;font-size:12px;font-family:var(--sans);outline:none;min-width:160px}
.srch:focus{border-color:var(--accent)}

/* headroom / limit bars */
.hr-bar{position:relative;height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:120px}
.hr-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.hr-mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}

/* waterfall */
.wf{display:flex;align-items:flex-end;gap:2px;height:150px;padding-top:10px}
.wf-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.wf-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px}
.wf-lab{font-size:9.5px;color:var(--muted);text-align:center;line-height:1.2}
.wf-v{font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}

/* scatter */
.scatter{position:relative;height:300px;border:1px solid var(--line);border-radius:var(--r);background:
  linear-gradient(var(--panel-2) 0 0) no-repeat;margin-top:4px}
.sc-q{position:absolute;font-size:10px;color:var(--muted-2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sc-axis{position:absolute;background:var(--line-2)}
.sc-pt{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;border:1.5px solid #fff;box-shadow:var(--sh)}
.sc-pt:hover{width:14px;height:14px}
.sc-lbl{position:absolute;font-size:9px;color:var(--ink-2);transform:translate(-50%,6px);font-weight:600;pointer-events:none}

/* scenario */
.shock-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.shock-row:last-child{border:none}
.shock-name{width:150px;font-size:12.5px;font-weight:500}
.shock-slider{flex:1;height:5px;border-radius:3px;background:var(--line);position:relative}
.shock-slider i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px}
.shock-val{width:70px;text-align:right;font-weight:600;font-family:var(--mono);font-size:12px}
.preset{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line-2);border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;margin:0 6px 6px 0;background:var(--panel)}
.preset:hover{border-color:var(--accent);color:var(--accent)}

/* ask point */
.chatlog{display:flex;flex-direction:column;gap:14px;max-width:820px}
.q-bub{align-self:flex-end;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px 12px 2px 12px;font-size:13px;max-width:80%}
.a-bub{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 12px 2px;width:100%;overflow:hidden}
.a-sec{padding:11px 15px;border-bottom:1px solid var(--line)}
.a-sec:last-child{border:none}
.a-lab{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:6px}
.a-big{font-size:15px;font-weight:600}
.a-drv{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
.a-drv:last-child{border:none}
.ask-bar{display:flex;gap:9px;margin-top:14px;max-width:820px}
.ask-bar input{flex:1;border:1px solid var(--line-2);border-radius:var(--r);padding:11px 13px;font-family:var(--sans);font-size:13px;outline:none}
.ask-bar input:focus{border-color:var(--accent)}
.suggest{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;max-width:820px}
.sg{font-size:11.5px;padding:6px 11px;border:1px solid var(--line-2);border-radius:20px;cursor:pointer;color:var(--ink-2);background:var(--panel)}
.sg:hover{border-color:var(--accent);color:var(--accent)}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(16,24,40,.35);opacity:0;pointer-events:none;transition:.2s;z-index:90}
.ov.on{opacity:1;pointer-events:auto}
.drw{position:fixed;top:0;right:0;height:100vh;width:min(560px,96vw);background:var(--panel);border-left:1px solid var(--line-2);
  box-shadow:-20px 0 60px -20px rgba(16,24,40,.3);transform:translateX(100%);transition:.26s cubic-bezier(.3,.8,.3,1);z-index:100;display:flex;flex-direction:column}
.drw.on{transform:none}
.drw-h{padding:15px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.drw-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.drw-x{margin-left:auto;width:30px;height:30px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel);cursor:pointer;color:var(--muted);font-size:15px}
.drw-ttl{font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.drw-b{overflow-y:auto;padding:16px 18px 30px}
.drw-sec{margin-bottom:20px}
.drw-sl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:9px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r)}
.kv2 .c{background:var(--panel);padding:9px 11px}
.kv2 .k{font-size:10.5px;color:var(--muted)}
.kv2 .v{font-size:14px;font-weight:700;margin-top:2px}
.evi{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.evi:last-child{border:none}
.evi .src{font-weight:600;width:110px;flex:none;color:var(--accent)}
.prov{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:11.5px;color:var(--muted);line-height:1.5}
.prov b{color:var(--ink-2)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.two{grid-template-columns:1fr}}

/* decision/journal */
.dj{border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;margin-bottom:10px;background:var(--panel)}
.dj-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.dj-date{font-size:11px;color:var(--muted);font-weight:600}
.dj-rec{font-size:13px;font-weight:600}
.dj-row{font-size:12px;color:var(--ink-2);margin:3px 0;line-height:1.5}
.dj-row .k{color:var(--muted);display:inline-block;width:120px}
.dj-out{display:flex;gap:16px;margin-top:8px;padding-top:9px;border-top:1px solid var(--line)}
.dj-out .o .v{font-size:14px;font-weight:700}.dj-out .o .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

/* mover bars */
.mover{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.mover:last-child{border:none}
.mover .tk{width:62px}
.mv-track{flex:1;height:18px;position:relative;display:flex;align-items:center}
.mv-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)}
.mv-b{position:absolute;height:11px;border-radius:2px}
.mover .pnl{width:72px;text-align:right;font-weight:600;font-family:var(--mono)}

/* catalyst */
.cal-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}

        <div class="c"><div class="k">Crowding</div><div class="v" style="font-size:13px">${p[14]}</div></div></div>

        <div class="prov" style="color:var(--ink-2);margin-bottom:12px"><b>Conductor conclusion:</b> ${p[17]==='TRIM'?'Trim — high risk budget for low/negative return.':p[17]==='WATCH'?'Hold / do not add — upside momentum intact but concentration and macro beta make incremental exposure unattractive.':'Core holding — thesis intact, efficient risk.'}</div>
        <div class="drw-sl">Contributing agents</div>
        ${[['Risk',p[17]==='TRIM'?'NEGATIVE':'NEUTRAL'],['Technical',p[6]>=0?'POSITIVE':'NEGATIVE'],['Flows',p[14]==='High'?'CROWDED':'POSITIVE'],['Macro','NEGATIVE'],['Earnings',p[16]==='—'?'NEUTRAL':'WATCH']].map(a=>`<div class="a-drv"><span>${a[0]} Agent</span><span class="pill ${a[1]==='POSITIVE'?'ok':a[1]==='NEGATIVE'||a[1]==='CROWDED'?'crit':'neu'}" style="font-size:9.5px">${a[1]}</span></div>`).join('')}
      </div>
      <div data-tabc="risk" style="display:none"><div class="kv2" style="margin-bottom:12px"><div class="c"><div class="k">VaR contribution</div><div class="v num">${p[9]}%</div></div><div class="c"><div class="k">Risk budget</div><div class="v num">${p[10]}%</div></div><div class="c"><div class="k">Used</div><div class="v num ${p[11]>=90?'neg':''}">${p[11]}%</div></div><div class="c"><div class="k">Return contribution</div><div class="v num ${cls(p[19])}">${sgn(p[19],'%')}</div></div><div class="c"><div class="k">Liquidity</div><div class="v num">${p[15]} days</div></div><div class="c"><div class="k">Factor</div><div class="v" style="font-size:13px">${p[13]}</div></div></div>
        <div class="prov">Efficiency: ${p[19]>=8?'<b style="color:var(--pos)">GOOD</b> — strong return per unit of risk.':p[19]>=0?'<b style="color:var(--warn)">FAIR</b>.':'<b style="color:var(--crit)">POOR</b> — high risk for negative return, trim candidate.'}</div></div>
      <div data-tabc="intel" style="display:none"><div class="drw-sl">Recent filings & news</div>
        <div class="evi"><span class="src">8-K</span><span>Material agreement filed · 1d ago</span></div>
        <div class="evi"><span class="src">Form 4</span><span>Insider activity · aggregated</span></div>
        <div class="evi"><span class="src">Analyst</span><span>Estimate revisions trending ${p[6]>=0?'up':'down'}</span></div>
        <div class="drw-sl" style="margin-top:14px">Sentiment</div><div class="kv2"><div class="c"><div class="k">Current</div><div class="v num">67 / 100</div></div><div class="c"><div class="k">30D change</div><div class="v num pos">+14</div></div></div>
        <div class="drw-sl" style="margin-top:14px">Catalyst</div><div class="prov">${p[16]==='—'?'No scheduled catalyst in the next 30 days.':p[16]}</div></div>
      <div data-tabc="thesis" style="display:none">
        <div class="drw-sl">Thesis alignment</div>
        <div class="kv2" style="margin-bottom:12px"><div class="c"><div class="k">Current</div><div class="v num ${p[17]==='TRIM'?'neg':''}">${p[17]==='TRIM'?'61%':'82%'}</div></div><div class="c"><div class="k">Previous</div><div class="v num">86%</div></div></div>
        ${p[17]==='TRIM'?`<div class="drw-sl">New evidence contradicting thesis</div><div class="prov" style="color:var(--ink-2)">1. Gross-margin guidance weakened.<br/>2. Capex growth exceeded original assumption.<br/>3. Competitor pricing pressure increased.</div>`:`<div class="prov">Thesis intact. Recorded assumptions remain consistent with latest evidence.</div>`}
        <div style="margin-top:14px;display:flex;gap:8px"><button class="btn pri" data-goto="scenarios">Run what-if</button><button class="btn gh" data-approve>Log decision</button></div></div>
    </div>`);
}

/* ======================= FUND SWITCHER + ROUTING ======================= */
function renderFundMenu(){
  const menu=Q('#fundsel-menu');
  menu.innerHTML=`<div class="nav-lab" style="padding:6px 8px 4px">Switch fund · 4</div>`+Object.entries(FUNDS).map(([id,f])=>`<div class="fund-opt ${id===FUND?'on':''}" data-fund="${id}"><span class="fs-ic" style="background:${f.col}">${f.ic}</span><div><div class="fs-name">${f.name}</div><div class="fs-sub">${f.sub}</div></div><span class="fo-aum num">${f.aum}</span></div>`).join('');
  menu.querySelectorAll('.fund-opt').forEach(o=>o.onclick=()=>{selectFund(o.dataset.fund);Q('#fundsel').classList.remove('open');});
}
function selectFund(id){
  FUND=id; const f=FUNDS[id];
  Q('#fs-ic').textContent=f.ic; Q('#fs-ic').style.background=f.col;
  Q('#fs-name').textContent=f.name; Q('#fs-sub').textContent=f.sub;
  try{localStorage.setItem('point-inst-fund',id);}catch(e){}
  renderAll(); renderFundMenu();
}
const RENDER={command:renderCommand,portfolio:renderPortfolio,risk:renderRisk,guidelines:renderGuidelines,
  opportunities:renderOpps,scenarios:renderScenarios,pnl:renderPnl,decisions:renderDecisions,
  alerts:renderAlerts,ask:renderAsk,reports:renderReports,audit:renderAudit};
function renderAll(){Object.values(RENDER).forEach(fn=>fn());}

let VIEW='command';
function go(v){
  VIEW=v;
  QA('.view').forEach(s=>s.classList.toggle('on',s.id==='view-'+v));
  QA('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  window.scrollTo(0,0);
}

/* ======================= WIRE ======================= */
renderFundMenu();
try{const sf=localStorage.getItem('point-inst-fund'); if(sf&&FUNDS[sf])FUND=sf; const f=FUNDS[FUND]; Q('#fs-ic').textContent=f.ic;Q('#fs-ic').style.background=f.col;Q('#fs-name').textContent=f.name;Q('#fs-sub').textContent=f.sub;}catch(e){}
renderAll();

Q('#fundsel-btn').onclick=e=>{e.stopPropagation();Q('#fundsel').classList.toggle('open');};
document.addEventListener('click',()=>Q('#fundsel').classList.remove('open'));
Q('#fundsel-menu').onclick=e=>e.stopPropagation();

QA('#nav a').forEach(a=>a.onclick=()=>go(a.dataset.v));

/* delegated clicks */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-goto]'); if(nav){go(nav.dataset.goto);return;}
  const card=e.target.closest('[data-card]'); if(card&&!e.target.closest('[data-approve]')&&!e.target.closest('[data-goto]')){openCard(card.dataset.card);return;}
  const pos=e.target.closest('[data-pos]'); if(pos){openPos(pos.dataset.pos);return;}
  const pf=e.target.closest('[data-pf]'); if(pf){posFilter=pf.dataset.pf;renderPortfolio();return;}
  const th=e.target.closest('th[data-sort]'); if(th){const k=+th.dataset.sort; posSort.dir=(posSort.k===k?-posSort.dir:-1);posSort.k=k;renderPortfolio();return;}
  const hc=e.target.closest('[data-hc]'); if(hc){const c=health()[+hc.dataset.hc];openDrw(`<div class="drw-h"><div class="drw-top"><span class="tag">Health component</span><button class="drw-x" id="drw-x">✕</button></div><div class="drw-ttl">${c[0]} · ${c[1]}/100</div></div><div class="drw-b"><div class="prov" style="color:var(--ink-2);font-size:13px">${c[3]}</div><div class="kv2" style="margin-top:14px"><div class="c"><div class="k">Current</div><div class="v num">${c[1]}</div></div><div class="c"><div class="k">Yesterday</div><div class="v num">${c[1]-c[2]}</div></div><div class="c"><div class="k">Change</div><div class="v num ${cls(c[2])}">${sgn(c[2])}</div></div><div class="c"><div class="k">Benchmark</div><div class="v num">${c[4]}</div></div></div></div>`);return;}
  const lim=e.target.closest('[data-limit]'); if(lim){openLimit(lim.dataset.limit);return;}
  const sg=e.target.closest('[data-ask]'); if(sg){askQ(sg.dataset.ask);return;}
});
function openLimit(name){
  const r=LIMITS.find(x=>x[0]===name); if(!r)return;
  openDrw(`<div class="drw-h"><div class="drw-top"><span class="pill ${r[9]==='WARN'?'warn':'ok'}">${r[9]}</span><span class="tag">${r[1]}</span><button class="drw-x" id="drw-x">✕</button></div><div class="drw-ttl">${r[0]}</div></div>
    <div class="drw-b"><div class="kv2" style="margin-bottom:16px"><div class="c"><div class="k">Current</div><div class="v num">${r[2]}</div></div><div class="c"><div class="k">Warning</div><div class="v num">${r[3]}</div></div><div class="c"><div class="k">Limit</div><div class="v num">${r[4]}</div></div><div class="c"><div class="k">Headroom</div><div class="v num">${r[5]}</div></div></div>
    <div class="drw-sl">Breach forecast</div><div class="kv2" style="margin-bottom:16px"><div class="c"><div class="k">1 day</div><div class="v num ${parseFloat(r[6])>40?'neg':''}">${r[6]}</div></div><div class="c"><div class="k">3 day</div><div class="v num">${r[7]}</div></div><div class="c"><div class="k">5 day</div><div class="v num">${r[8]}</div></div><div class="c"><div class="k">Trend</div><div class="v" style="font-size:13px">${r[9]==='WARN'?'Deteriorating':'Stable'}</div></div></div>
    <div class="drw-sl">Source clause</div><div class="prov" style="color:var(--ink-2)"><b>Document:</b> ${r[1].includes('IMA')?'Investment Management Agreement':'Risk Policy'}<br/><b>Section:</b> ${r[1].split('§')[1]||'—'}<br/><b>Machine rule:</b> <span class="mono">metric ${r[0].toLowerCase().replace(/[^a-z]/g,'_')} ≤ ${r[4]}</span><br/><b>Approved by:</b> Jane Smith (Compliance)<br/><b>Version:</b> 3 · Sep 21, 2026</div>
    <div style="margin-top:14px;display:flex;gap:8px"><button class="btn pri" data-goto="scenarios">Run what-if</button><button class="btn gh">View positions</button></div></div>`);
}
function askQ(q){
  const log=Q('#chatlog');
  log.insertAdjacentHTML('beforeend',`<div class="q-bub">${q}</div>`+answerBubble(ANSWERS.default));
  log.lastElementChild.scrollIntoView({behavior:'smooth'});
}
Q('#view-ask').addEventListener?.('click',()=>{}); // noop guard
document.addEventListener('click',e=>{
  if(e.target.id==='ask-send'){const inp=Q('#ask-in');if(inp&&inp.value.trim()){askQ(inp.value.trim());inp.value='';}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ask-in'&&e.target.value.trim()){askQ(e.target.value.trim());e.target.value='';}});
Q('#ask-mini-in')?.addEventListener('keydown',e=>{if(e.key==='Enter'){go('ask');}});
Q('#ask-mini')?.addEventListener('click',()=>go('ask'));

/* role picker */
const ROLES=[['PM · Apex L/S','command'],['Head of Risk','risk'],['CIO','portfolio'],['Compliance','guidelines'],['Investor Relations','reports']];
let roleI=0;
Q('#role-pick').onclick=()=>{roleI=(roleI+1)%ROLES.length;Q('#rp-role').textContent=ROLES[roleI][0];go(ROLES[roleI][1]);};
})();

</script>
</body>
</html>
